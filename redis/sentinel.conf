# Redis Sentinel config, shared as a read-only template across all three
# redis-sentinel-N containers in docker-compose.yml (added when
# docker-compose.yml's single-node `redis` service became a real
# master/2-replica/3-sentinel topology, closing the "real message broker
# cluster" style gap ROADMAP.md item 12 disclosed for the queue's own
# backend, not just OpenSearch).
#
# WHY A SHARED TEMPLATE, NOT A LIVE CONFIG FILE MOUNTED DIRECTLY:
# Sentinel rewrites its own config file at runtime (recording which
# replica is currently promoted, election state, etc.) -- mounting this
# file read-write directly into all three containers would have all three
# processes writing the same host file concurrently, which is exactly the
# kind of silent-corruption risk this project doesn't take chances with
# (see BUGS_AND_FIXES.md's own repeated "found by testing, not assumed"
# discipline). Instead, docker-compose.yml's command for each sentinel
# container copies this read-only template into its own container-local
# writable path (`/tmp/sentinel.conf`) before starting `redis-sentinel`,
# so each of the 3 processes owns an independent, real file it's actually
# allowed to rewrite.
#
# sentinel resolve-hostnames / announce-hostnames: without these two
# (added in Redis 6.2), Sentinel would track Docker's internal container
# IPs instead of the stable service hostnames Compose's embedded DNS
# provides -- a real, checkable requirement for this to work at all
# inside Docker Compose's default bridge network, not an arbitrary
# tuning choice. announce-hostnames specifically matters for the
# redis-py Sentinel client (used by RedisStorageProvider and
# queue_consumer.py): it's what lets the client ask Sentinel "who's the
# current master" and get back a name ("redis-master" or, after a
# failover, "redis-replica-1"/"redis-replica-2") it can actually resolve
# on redact-net, rather than a container IP that may already be stale by
# the time the client tries to use it.
port 26379
dir /tmp
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor redact-master redis-master 6379 2
sentinel down-after-milliseconds redact-master 5000
sentinel failover-timeout redact-master 10000
sentinel parallel-syncs redact-master 1
