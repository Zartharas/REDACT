# Redis Sentinel config, shared as a read-only template across all three
# redis-sentinel-N containers in docker-compose.yml (added when
# docker-compose.yml's single-node `redis` service became a real
# master/2-replica/3-sentinel topology, closing the "real message broker
# cluster" style gap ROADMAP.md item 12 disclosed for the queue's own
# backend, not just OpenSearch).
#
# WHY A SHARED TEMPLATE, NOT A LIVE CONFIG FILE MOUNTED DIRECTLY:
# Sentinel rewrites its own config file at runtime (recording which
# replica is currently promoted, election state, etc.) -- mounting this
# file read-write directly into all three containers would have all three
# processes writing the same host file concurrently, which is exactly the
# kind of silent-corruption risk this project doesn't take chances with
# (see BUGS_AND_FIXES.md's own repeated "found by testing, not assumed"
# discipline). Instead, docker-compose.yml's command for each sentinel
# container copies this read-only template into its own container-local
# writable path (`/tmp/sentinel.conf`) before starting `redis-sentinel`,
# so each of the 3 processes owns an independent, real file it's actually
# allowed to rewrite.
#
# CORRECTED, 2026-08-11 (Bug 23, BUGS_AND_FIXES.md), found by a live
# failover test, not assumed: this file originally used `sentinel
# resolve-hostnames yes` + `sentinel monitor redact-master redis-master
# 6379 2` -- tracking the master by its Compose service HOSTNAME rather
# than a fixed IP. That looked reasonable (a hostname survives a
# container restart in a way a dynamically-assigned IP wouldn't) but
# broke failover outright the one time it mattered: killing
# redis-master's container removes its service-name entry from Docker's
# embedded DNS immediately, and Sentinel's periodic re-resolution of its
# monitored master's hostname (needed to keep resolve-hostnames' tracked
# address current) started failing every cron cycle
# ("Failed to resolve hostname 'redis-master'", repeating once per
# second) and never recovered on its own -- `sentinel
# get-master-addr-by-name` kept reporting the dead master's original
# address indefinitely, well past its own 10s failover-timeout. Fixed by
# giving redis-master/redis-replica-1/redis-replica-2 FIXED IPs instead
# (docker-compose.yml's `redact-net` now has an explicit subnet, .240/
# .241/.242 pinned to those three services) and monitoring the master's
# fixed IP directly below -- an IP was never a DNS entry, so it can't be
# deregistered the way a hostname is when its container dies, which is
# exactly the property this needs. resolve-hostnames/announce-hostnames
# are correspondingly OFF now: they exist specifically to translate
# between hostnames and IPs, which is no longer relevant once the
# monitored target is a fixed IP address rather than a name.
port 26379
dir /tmp
sentinel resolve-hostnames no
sentinel announce-hostnames no
sentinel monitor redact-master 172.28.0.240 6379 2
sentinel down-after-milliseconds redact-master 5000
sentinel failover-timeout redact-master 10000
sentinel parallel-syncs redact-master 1
