# Logstash pipeline: calls the tested REDACT Python service (src/service.py)
# for detection and anonymization, rather than reimplementing HMAC/token
# logic a second time in Ruby. One implementation, not two that can drift
# apart -- see README for why this replaced an earlier all-Ruby draft.
#
# Prerequisites:
#   - src/service.py running and reachable (default http://redact-service:8080
#     inside Docker Compose, http://localhost:8080 for local testing)
#   - Logstash's http filter plugin (bundled by default in recent Logstash
#     releases; confirm with `bin/logstash-plugin list | grep http`)
#
# This file was originally written and syntax-checked against documented
# plugin behavior without a live Logstash instance available -- that has
# since changed. It has now been run repeatedly against a live Logstash
# 8.15.0 instance, end to end, against all 10,000 synthetic lines at once.
# That testing found and fixed seven real bugs, several of which failed
# completely silently (no crash, no error, every request still returning
# 200 OK) while destroying or misrouting the majority of processed events.
# Full root-cause writeups, evidence, and fixes are in BUGS_AND_FIXES.md at
# the repo root -- read that file, not just the inline comments below, for
# the complete picture of what's been verified here. The service this file
# calls (src/service.py) was tested directly first, including with the
# exact log lines used as examples below, before this file itself was
# tested against a live instance.

input {
  file {
    path => ["/var/log/security/windows_events.log",
              "/var/log/security/syslog",
              "/var/log/security/cloudtrail.json"]
    start_position => "beginning"
    sincedb_path => "/dev/null"  # demo only; use a real sincedb path in production
  }
}

filter {
  # Tag the log_type so downstream indices/dashboards can filter by source,
  # matching the log_type field the synthetic generator produces.
  if [path] =~ "windows_events" {
    mutate { add_field => { "log_type" => "windows_event" } }
  } else if [path] =~ "syslog" {
    mutate { add_field => { "log_type" => "syslog" } }
  } else if [path] =~ "cloudtrail" {
    mutate { add_field => { "log_type" => "cloudtrail" } }
  }

  # Call the REDACT service with the raw message. On success, the response
  # body's "anonymized" field replaces the original message and the
  # "audit_events" array is stashed on the event for the audit output below.
  #
  # CAVEAT, updated after live testing: the failure-tagging behavior below
  # (_httprequestfailure as the default tag on a failed request) has since
  # been empirically confirmed against Logstash 8.15.0 -- it's what
  # actually appeared in the logs during the Flask-timeout bug documented
  # in BUGS_AND_FIXES.md, and the quarantine routing that depends on it
  # worked as intended. Still confirm this tag name against your own
  # installed plugin version before relying on it in production, since this
  # was only verified against one specific version -- if it changes in a
  # future release, this pipeline will fail open silently instead of
  # quarantining.
  http {
    url => "${REDACT_SERVICE_URL:http://redact-service:8080/anonymize}"
    verb => "POST"
    # Engineering upgrade: redact-service now requires this header on every
    # route except /health (see src/service.py's _require_api_key -- added
    # after noting the service had zero authentication, so anything on the
    # Docker network that could reach port 8080 could call /anonymize
    # directly). Sourced from the same REDACT_SERVICE_API_KEY env var
    # docker-compose.yml wires into both containers, so this pipeline and
    # the service it's calling always agree on the current key without it
    # being hardcoded in either place.
    headers => { "X-Redact-Api-Key" => "${REDACT_SERVICE_API_KEY}" }
    # "log_type" added 2026-08-09, alongside redact-service switching its
    # default detection strategy from naive to field-gated NER
    # (src/service.py's /anonymize endpoint, src/detect.py's
    # detect_all_field_gated()). The [log_type] field is already set on
    # every event by the filter block above (add_field, based on which
    # input file matched) -- it just wasn't being forwarded to the
    # service that could actually use it. Without this, field-gating
    # still runs but degrades to naive-equivalent behavior for every
    # request (see detect.build_ner_candidate's documented fallback for
    # a missing/unrecognized log_type), silently losing the benefit this
    # pipeline exists to get. Untested against a live Logstash instance
    # since this specific change (the http filter's own body-forwarding
    # behavior was already verified live for the "log" field per this
    # file's BUGS_AND_FIXES.md history) -- same disclosure pattern as
    # everything else here that would need a live run to fully confirm.
    body => { "log" => "%{message}", "log_type" => "%{log_type}" }
    body_format => "json"
    target_body => "redact_response"
  }

  # Deterministic per-event ID, computed before the success/failure branch so
  # it's available to both the quarantine and anonymized output paths below.
  # Fixes a real bug found via live testing: the opensearch output plugin's
  # own bulk-retry logic (triggered here by OpenSearch being momentarily
  # unreachable during container startup, see the connection-refused/dead-
  # instance warnings in Logstash's boot log) resubmits whole batches whose
  # first attempt may have already been accepted server-side but timed out
  # client-side before acknowledging. Without a document_id, OpenSearch
  # assigns a fresh random _id to the retry, producing a genuine duplicate
  # document rather than an idempotent overwrite -- this was silently
  # doubling (in one observed run, doubling almost exactly) the
  # security-logs-anonymized index, confirmed by comparing redact-service's
  # own access-log request count (10,000, matching the raw line count
  # exactly) against OpenSearch's stored document count (~19,972), which
  # proved the duplication happened at the write stage, not the read stage.
  # The audit-trail output already guarded against this exact scenario (see
  # its document_id comment below); this extends the same fix to the other
  # two output branches, which had been missing it.
  #
  # SECOND BUG, found via a follow-up live test of the fix above: the first
  # version of this filter hashed only ["message", "[log][file][path]"].
  # That correctly made *retries* of the same event idempotent, but had a
  # much worse side effect -- real security logs routinely contain the
  # exact same line text more than once (e.g. a fixed-field system event
  # like "EventID=4634 LogonType=3 TargetUserName=SYSTEM
  # TargetDomainName=NT_AUTHORITY" with no variable fields, which recurs
  # constantly and verbatim). Every occurrence of identical text hashed to
  # the identical document_id, so each new occurrence silently overwrote the
  # previous one in OpenSearch instead of being indexed as its own document.
  # In one test run, all 10,000 raw lines were successfully processed by
  # redact-service (confirmed via request-count comparison, same method as
  # above) but security-logs-anonymized topped out at only 579 documents --
  # over 9,000 genuinely distinct security events were being destroyed, not
  # just deduplicated.
  #
  # FIRST ATTEMPTED FIX (superseded, kept here as a documented dead end):
  # adding "@timestamp" to the fingerprint source. This helped (579 -> 984
  # -> 1984 surviving unique docs across repeated test runs) but never got
  # close to the ~9,984 expected. Root cause of why it fell short: the file
  # input reads 10,000 lines off local disk, which is fast enough that many
  # lines land within the same *millisecond* -- @timestamp's resolution
  # can't outrun local-disk read speed, so large batches of genuinely
  # distinct events still shared an identical timestamp and, combined with
  # this dataset's low content diversity, still collided on message+path.
  # docs.count == docs.deleted exactly on every run was the tell that
  # something structural, not just occasional retries, was still colliding.
  #
  # ACTUAL FIX: stop deriving the ID from content or time entirely. The only
  # property this ID ever needed (see the first bug above) was "retries of
  # the SAME event keep the same ID; two DIFFERENT events get different
  # IDs" -- it never needed to be deterministic or content-derived. A random
  # UUID generated once per event, early in the pipeline, satisfies both:
  # Logstash's http-output retry logic resubmits the same in-memory event
  # object, so a UUID already written onto that event survives the retry
  # unchanged (idempotent); two distinct events get cryptographically
  # independent UUIDs regardless of how close together in time or how
  # similar in content they are (eliminates collisions outright, doesn't
  # just make them less likely). logstash-filter-uuid ships in the default
  # Logstash distribution, no extra plugin install required.
  uuid {
    target => "[@metadata][doc_id]"
  }

  # Fail closed: if the http filter couldn't reach the service (tagged
  # _httprequestfailure) or the service itself returned an error field, mark
  # the event for quarantine rather than silently indexing an
  # un-anonymized event. This mirrors the fallback behavior described in
  # the chapter's architecture section: unavailable detection means the
  # event is marked Sensitive and held, not passed through as if clean.
  if "_httprequestfailure" in [tags] or [redact_response][error] {
    mutate {
      add_tag => ["sensitive_quarantine"]
      add_field => { "quarantine_reason" => "redact_service_unreachable_or_error" }
    }
  } else {
    mutate {
      replace => { "message" => "%{[redact_response][anonymized]}" }
      add_field => { "pii_span_count" => "%{[redact_response][span_count]}" }
    }

    # Fan out audit events as their own documents, without disturbing the
    # main log event. clone duplicates the event onto a separate branch
    # (the cloned copy's [type] field is set to the clone name, per the
    # logstash-filter-clone plugin's documented behavior); split then
    # explodes that branch's audit_events array into one event per array
    # element. This is the standard Logstash pattern for "one input event
    # produces N output documents" -- deliberately not a hand-rolled Ruby
    # loop, since a naive loop that repeatedly calls event.set on the same
    # field only keeps the last iteration's value, silently dropping every
    # audit event but one.
    #
    # CAVEAT: the clone filter's exact field-naming behavior has shifted
    # across logstash-filter-clone plugin versions in the past. Confirm
    # against `bin/logstash-plugin list --verbose | grep clone` and the
    # plugin's current documentation before relying on the [type] field
    # check below in production -- this was written from documented
    # behavior, not verified against a running Logstash instance.
    # THIRD BUG, found via live testing after both prior bugs were fixed:
    # this pipeline runs under pipeline.ecs_compatibility => v8 (visible in
    # Logstash's own startup log). Under ECS compatibility mode,
    # logstash-filter-clone does not set the legacy [type] field the way
    # this pipeline originally assumed -- it tags the clone instead. The
    # original code checked [type] == "audit_branch" here and in the output
    # block, which never matched under ECS mode, so the entire audit-trail
    # feature had never fired -- confirmed via `_cat/indices` never showing
    # a redact-audit-trail-* index at all across every prior test run.
    #
    # FOURTH BUG, found immediately after switching the routing check to
    # tags: logstash-filter-clone does not deep-copy the [tags] array. Once
    # the clone is tagged "audit_branch", that tag leaked back onto the
    # ORIGINAL event too (shared/mutated array reference, not an
    # independent copy) -- so the original also matched "audit_branch" in
    # [tags] in the output block below and was misrouted to
    # redact-audit-trail instead of security-logs-anonymized. Confirmed
    # live: with 10,000 requests processed, security-logs-anonymized landed
    # at exactly 1984 documents on two separate test runs with two
    # different (regenerated) synthetic datasets -- an identical count
    # across different input data is not plausible for a content-dependent
    # outcome, and pointed straight at a structural routing leak rather
    # than data variance. The ~1984 survivors are almost certainly just the
    # events with zero detected PII spans (clone/tagging never triggers on
    # them at all, since [redact_response][audit_events] is empty), while
    # nearly every event that DID contain PII was being silently diverted
    # away from the main anonymized index.
    #
    # FIX: stop using the clone filter and tag-based routing entirely, since
    # tags can't be trusted not to leak between clone and original. Do the
    # fan-out manually with a ruby filter using event.clone (a real,
    # independent deep copy at the Ruby/JRuby level, not a plugin-managed
    # shallow copy) and tag ONLY the new clone -- the original event is
    # never mutated, so it can't accidentally match the audit-branch
    # routing condition in the output block.
    # FIFTH BUG, found via the load test in validation/load_test/ (ROADMAP
    # item 9) at 100,000 lines: this branch used to leave the audit clone's
    # document_id decision entirely to the output block below, which used
    # "%{[audit_event][authentication_tag]}" (src/audit.py's
    # build_audit_event()). That tag is an HMAC over field_type, method,
    # policy_version, original_value_fingerprint, and a SECOND-granularity
    # timestamp (int(time.time())) -- deterministic by design, so retries
    # of the SAME audit event stay idempotent. But at higher sustained
    # throughput, genuinely DIFFERENT audit events sharing identical
    # content (the same repeated field value this project's synthetic
    # corpus is full of, e.g. "TargetUserName=SYSTEM" -- the exact same
    # repeat-content shape that caused Bug 4) landing in the same wall-
    # clock second now produce the IDENTICAL authentication_tag, and
    # silently overwrite each other on write. This is Bug 4's failure mode
    # again, reintroduced specifically here: Bug 4's actual fix (a random
    # UUID, not a content-derived ID) was only ever applied to the main
    # event's document_id ([@metadata][doc_id], set by the uuid filter
    # above), never to the audit branch, which kept a content-derived ID
    # on purpose for retry-idempotency without realizing it carried the
    # same collision risk Bug 4 had already found and fixed once.
    #
    # Confirmed live at 100,000 lines: Logstash's own pipeline stats
    # (GET /_node/stats/pipelines/main, queried via `docker exec
    # redact-logstash curl ...` since Logstash's monitoring port isn't
    # published to the host) showed this ruby filter correctly fanning out
    # 89,159 audit events (in=100000, out=189159 overall -- 100,000
    # originals + 89,159 clones), and the opensearch output plugin
    # reporting all 89,159 successfully sent (in=89159, out=89159). But
    # redact-audit-trail-*'s actual stored document count (queried with
    # track_total_hits=true, see reconcile.py's own fix in this same
    # commit) was only 55,577 -- a ~62% survival rate, consistent with
    # substantial same-second content collisions under sustained
    # ~950 events/sec throughput. Confirmed NOT a re-run of Bug 8 (a
    # _cat/indices or track_total_hits reporting artifact): the gap here
    # is between what Logstash's own output plugin reports SENDING
    # (89,159) and what OpenSearch actually STORED (55,577) -- both
    # correctly counted -- not a measurement pitfall on the reporting side.
    #
    # FIX: generate a fresh random UUID for each clone here, in the same
    # filter that creates it, instead of relying on the output block's
    # document_id to derive one from content. Using java.util.UUID
    # directly (JRuby interop, always available -- no gem `require`
    # needed) rather than Ruby's SecureRandom, to avoid any uncertainty
    # about stdlib availability inside Logstash's bundled JRuby. Retries
    # remain idempotent for the same reason the main event's UUID does:
    # Logstash's output retry logic resubmits the SAME in-memory cloned
    # event object, so the UUID already set on it survives the retry
    # unchanged. The authentication_tag remains in the document as a
    # field (audit.py's verify_audit_event() still checks it), it just no
    # longer doubles as the document's primary key.
    if [redact_response][audit_events] {
      ruby {
        code => '
          audit_events = event.get("[redact_response][audit_events]")
          if audit_events
            audit_events.each do |audit_event|
              clone = event.clone
              clone.set("[audit_event]", audit_event)
              clone.set("[@metadata][audit_doc_id]", java.util.UUID.randomUUID.toString)
              existing_tags = clone.get("tags") || []
              clone.set("tags", existing_tags + ["audit_branch"])
              new_event_block.call(clone)
            end
          end
        '
      }
    }
  }
}

output {
  if "sensitive_quarantine" in [tags] {
    opensearch {
      hosts => ["${OPENSEARCH_HOST:https://opensearch:9200}"]
      index => "security-logs-quarantine-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  } else if "audit_branch" in [tags] {
    # Each event here is one audit_event entry, exploded into its own event
    # by the ruby filter above (see that filter's comments for why this is
    # a hand-rolled ruby fan-out rather than the standard clone+split
    # pattern) -- already a complete, signed record from src/audit.py.
    # Route it to its own restricted index rather than nesting it inside
    # the log event, and use its signature as the document ID so a
    # retried/duplicate delivery overwrites rather than duplicates the
    # audit record.
    #
    # Routes on tags rather than [type] -- see the matching comment on the
    # ruby filter above for why: [type] never gets set by the clone filter
    # under this pipeline's pipeline.ecs_compatibility => v8 setting, which
    # silently broke this entire branch (confirmed via live testing: zero
    # redact-audit-trail-* documents ever existed before that fix, and every
    # audit clone was instead overwriting its sibling original event in
    # security-logs-anonymized under the same document_id). The clone
    # filter itself was then replaced outright (see ruby filter comments)
    # once it turned out to also be leaking the audit_branch tag onto
    # original events via a shared, non-deep-copied tags array.
    opensearch {
      hosts => ["${OPENSEARCH_HOST:https://opensearch:9200}"]
      index => "redact-audit-trail-%{+YYYY.MM}"
      # FOURTH BUG, found via live testing immediately after the [type] ->
      # tags routing fix got audit events flowing at all: this originally
      # read document_id => "%{[audit_event][signature]}". src/audit.py's
      # build_audit_event() has never produced a field called "signature" --
      # its actual fields are field_type, method, policy_version,
      # original_value_fingerprint, timestamp, and authentication_tag.
      # Logstash's %{} field reference does not error when a field is
      # missing; it silently leaves the literal unresolved string in place.
      # So every audit event in this pipeline's history was written with the
      # exact same document_id -- the literal text
      # "%{[audit_event][signature]}" -- each one overwriting the last.
      # Confirmed via live testing: after the routing fix above finally let
      # audit events reach this output block, redact-audit-trail showed
      # docs.count=1, docs.deleted=1286 for a single test run -- every one
      # of those 1286 audit records had overwritten the previous one under
      # the identical literal ID. Fixed at the time by referencing
      # authentication_tag instead, which was unique enough at demo scale
      # (10,000 lines) to go unnoticed as still fundamentally
      # content-derived.
      #
      # FIFTH BUG, found via the 100,000-line load test (see the ruby
      # filter's comment above for the full writeup): authentication_tag
      # is an HMAC over content plus a SECOND-granularity timestamp, so
      # genuinely distinct audit events sharing identical content within
      # the same wall-clock second collide and silently overwrite each
      # other -- Bug 4's exact failure mode, reintroduced here because
      # Bug 4's actual fix (a random, non-content-derived ID) was never
      # applied to this branch. Fixed the same way Bug 4 was fixed for the
      # main event: document_id now references a random UUID
      # (audit_doc_id) generated once per clone in the ruby filter above,
      # not a value derived from the event's own content.
      document_id => "%{[@metadata][audit_doc_id]}"
    }
  } else {
    opensearch {
      hosts => ["${OPENSEARCH_HOST:https://opensearch:9200}"]
      index => "security-logs-anonymized-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
    }
  }
}
