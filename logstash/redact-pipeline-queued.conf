# Alternate, queue-decoupled ingestion pipeline. See docker-compose.yml's
# logstash-queued and queue-consumer service comments for the full
# architecture and the disclosed List-vs-Streams tradeoff. Activate with
# `docker compose --profile queued up` instead of the default
# `docker compose up` -- do NOT run this against the same
# ./data/raw files at the same time as the default redact-pipeline.conf's
# logstash service; both tail the same files independently and would each
# process every line, double-counting everything downstream.
#
# Deliberately minimal compared to redact-pipeline.conf: this pipeline's
# only job is "read raw log lines, tag log_type, push to Redis" -- no
# http filter, no uuid filter, no audit fan-out, no quarantine routing.
# All of that (calling redact-service, generating document IDs,
# routing to the anonymized/quarantine/audit indices) moves to
# src/queue_consumer.py on the other side of the queue, which is why that
# script's own docstring carefully replicates redact-pipeline.conf's
# document-ID and index-routing logic rather than reinventing it --
# see that file for why (Bugs 4/12's collision history, Bug 15's
# audit-routing history) each of those choices matters.
#
# UNVERIFIED against a live Logstash instance in this sandbox (no Docker
# daemon here) -- needs the user's machine, same disclosure as every
# other Logstash config in this project until it's actually been run.

input {
  file {
    path => ["/var/log/security/windows_events.log",
              "/var/log/security/syslog",
              "/var/log/security/cloudtrail.json"]
    start_position => "beginning"
    sincedb_path => "/dev/null"  # demo only; use a real sincedb path in production
  }
}

filter {
  if [path] =~ "windows_events" {
    mutate { add_field => { "log_type" => "windows_event" } }
  } else if [path] =~ "syslog" {
    mutate { add_field => { "log_type" => "syslog" } }
  } else if [path] =~ "cloudtrail" {
    mutate { add_field => { "log_type" => "cloudtrail" } }
  }

  # No field pruning here on purpose: logstash-filter-prune would be the
  # obvious choice to strip everything except [message]/[log_type] before
  # pushing to Redis, but it is NOT confirmed bundled in the default
  # Logstash distribution the way mutate/uuid/http are (this project's
  # own redact-pipeline.conf only uses plugins already live-verified
  # against the actual installed image -- see that file's own header
  # comment on why "documented behavior" and "verified behavior" are
  # treated as different things here). Rather than add an unverified
  # plugin dependency to save a few unused bytes per event, this pipeline
  # pushes the whole Logstash event (message, log_type, and whatever else
  # Logstash's own defaults add -- @version, host, [log][file][path],
  # etc.) as JSON, and src/queue_consumer.py simply reads only the two
  # fields it needs and ignores the rest. Harmless, not free (slightly
  # larger Redis payloads than strictly necessary) -- a real production
  # deployment optimizing queue throughput at high volume might revisit
  # this once logstash-filter-prune's bundled status is actually
  # confirmed against the deployed image.
}

output {
  redis {
    # DISCLOSED, REAL LIMITATION -- not Sentinel-aware, unlike
    # src/queue_consumer.py on the other side of this queue: the official
    # logstash-output-redis plugin's `host` config takes a fixed
    # hostname (or a list, for round-robining across independent shards
    # -- not the same thing as Sentinel-style master failover), with no
    # built-in way to ask Sentinel "who's the current master." Pointed at
    # redis-master by default, matching docker-compose.yml's topology
    # (a real master/2-replica/3-sentinel cluster, ROADMAP item 12) --
    # but if redis-master genuinely fails and Sentinel promotes a
    # replica, THIS producer keeps retrying the now-dead old master's
    # hostname and will not automatically start writing to the new one.
    # Full writeup in docker-compose.yml's own logstash-queued comment
    # and BUGS_AND_FIXES.md.
    host => ["${REDIS_HOST:redis-master}"]
    data_type => "list"
    key => "${REDACT_QUEUE_KEY:redact:raw-events}"
    codec => json
  }
}
