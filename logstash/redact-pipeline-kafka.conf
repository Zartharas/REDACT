# Kafka-shaped alternative to redact-pipeline-queued.conf's Redis-list
# producer, added 2026-08-11 (ROADMAP item 13). Same job (read raw log
# lines, tag log_type, push to a queue for src/queue_consumer.py's Kafka
# consumer path -- see that file's own "Kafka alternative" docstring
# section) via the Kafka output plugin instead of the Redis output.
#
# WHY THIS IS A REAL IMPROVEMENT OVER THE REDIS PATH, NOT JUST A
# DIFFERENT TRANSPORT: redact-pipeline-queued.conf's own comment above
# discloses that the official logstash-output-redis plugin has no
# Sentinel awareness -- after a failover it keeps retrying the dead old
# master. logstash-output-kafka (the official plugin this file uses) DOES
# have real broker-discovery and leader-election awareness built in as
# standard Kafka client behavior (bootstrap.servers only needs ONE
# reachable broker to discover the rest of the cluster and follow
# partition leadership changes automatically) -- this genuinely closes
# the producer-side gap the Redis path has always disclosed, not just
# moved it somewhere else.
#
# logstash/Dockerfile explicitly installs logstash-integration-kafka
# (idempotent either way -- see that file's own comment for why this is
# safe regardless of whether it turns out to already be bundled by
# default). UNVERIFIED against a live container in this sandbox (no
# Docker daemon here), same as every other new piece of Logstash config
# in this project until it's actually been run.
#
# Activate with `docker compose --profile kafka-queued up` (NOT
# alongside the default or `queued` profiles against the same
# ./data/raw files -- same double-processing warning as
# redact-pipeline-queued.conf's own header comment).

input {
  file {
    path => ["/var/log/security/windows_events.log",
              "/var/log/security/syslog",
              "/var/log/security/cloudtrail.json"]
    start_position => "beginning"
    sincedb_path => "/dev/null"  # demo only; use a real sincedb path in production
  }
}

filter {
  if [path] =~ "windows_events" {
    mutate { add_field => { "log_type" => "windows_event" } }
  } else if [path] =~ "syslog" {
    mutate { add_field => { "log_type" => "syslog" } }
  } else if [path] =~ "cloudtrail" {
    mutate { add_field => { "log_type" => "cloudtrail" } }
  }

  # Same reasoning as redact-pipeline-queued.conf: no field pruning here,
  # pushes the whole Logstash event as JSON and lets
  # src/queue_consumer.py read only what it needs.
}

output {
  kafka {
    # ${KAFKA_BROKERS} matches src/queue_consumer.py's own env var name
    # exactly, so the same value configures both sides of the queue --
    # deliberately NOT reusing REDIS_HOST's naming convention, since this
    # is a genuinely different transport, not a drop-in host swap.
    bootstrap_servers => "${KAFKA_BROKERS:kafka:9092}"
    topic_id => "${KAFKA_TOPIC:redact-raw-events}"
    codec => json
    # acks=all -- wait for all in-sync replicas to acknowledge before
    # this producer considers the write durable, matching the same
    # "don't silently lose data" principle every other write path in
    # this project follows (see index_document()'s own idempotent-ID
    # reasoning in queue_consumer.py).
    acks => "all"
  }
}
