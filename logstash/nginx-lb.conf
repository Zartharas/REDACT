# Reverse proxy in front of the (scalable) redact-service pool.
# See docker-compose.yml's redact-lb service comment for the full
# rationale -- summary: nginx's default proxy_pass to a bare hostname
# resolves DNS once, at config-load/first-request time, and then reuses
# that single resolved IP for the lifetime of the worker process (or the
# keepalive connection) rather than re-resolving on every request. Docker
# Compose's embedded DNS (127.0.0.11) DOES return every healthy
# "redact-service" replica's IP when the service is scaled, but nginx
# wouldn't actually use that fact without being told to re-resolve
# periodically -- silently defeating load balancing across replicas while
# looking, from the outside, like it was working (requests still succeed,
# they just all land on whichever replica was first resolved).
#
# The fix is the standard, documented Docker+nginx technique: declare
# Docker's own embedded DNS resolver explicitly with a short TTL, and put
# the upstream hostname in a variable rather than a literal in
# proxy_pass -- nginx only re-resolves a variable's hostname per the
# resolver's `valid` setting; a literal hostname in proxy_pass is
# resolved once at startup regardless of any resolver directive.
#
# NOT YET VERIFIED against a live multi-replica Docker Compose run in
# this sandbox (no Docker daemon available here) -- needs the user's
# machine. If `docker compose up --scale redact-service=3` doesn't
# actually distribute requests across all three replicas (check each
# replica's own request count via `docker compose logs redact-service`
# or a per-replica counter), that's the first thing to check, not
# assumed correct just because this file matches documented nginx/Docker
# behavior on paper -- the same standard this project applies to every
# other unverified Docker Compose claim.

resolver 127.0.0.11 valid=5s;

server {
    listen 8080;

    location / {
        set $upstream redact-service;
        proxy_pass http://$upstream:8080$request_uri;
        proxy_http_version 1.1;
        # Deliberately NOT "Connection: keep-alive" reused across
        # requests to the SAME resolved IP -- close per request so the
        # next request re-triggers the resolver above instead of riding
        # an existing pooled connection to one replica indefinitely.
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
