name: CI

# Two jobs, split by what they need, so a missing external dependency
# (Redis, network access to census.gov/ssa.gov) fails loudly and
# specifically instead of one big job failing for an ambiguous reason.
#
# fast-tests: pure Python, deterministic, no external services -- runs on
#   every push and PR, expected to finish in well under a minute.
# redis-tests: needs a live Redis, supplied here as a GitHub Actions
#   service container (no Docker Compose needed for this -- just the one
#   service the Redis-backed StorageProvider tests require).
#
# Deliberately NOT included here: the Docker Compose stack tests
# (validation/load_test/, the full docker-compose.yml stack) and anything
# needing the en_core_web_lg spaCy model (validate.py, src/evaluate.py,
# validation/baseline_presidio_default.py). Both are real, verified parts
# of this project (see BUGS_AND_FIXES.md and ROADMAP.md for their
# verification history) but need more than a standard GitHub-hosted
# runner reasonably provides on every push -- Docker-in-Docker for a
# multi-container stack, and a multi-hundred-MB model download. Running
# those routinely is a real gap this workflow doesn't close; see
# BUGS_AND_FIXES.md/ROADMAP.md's own stated scope limits for why that's
# disclosed here rather than silently left out.
#
# container-scan: builds the redact-service image on the runner (this one
# CAN afford a Docker build+model download, since it only runs once per
# push and doesn't need Compose orchestrating three containers) and scans
# it with Trivy for known CVEs. Set to report-only (exit-code 0) rather
# than fail-the-build for now -- turning that into a hard gate on
# CRITICAL/HIGH findings is a reasonable next step, but doing it in the
# same change as introducing the scan would risk an unrelated, unreviewed
# base-image CVE blocking every future push on day one.
#
# CORRECTION, 2026-08-11 (Bug 20, BUGS_AND_FIXES.md): a prior version of
# this comment claimed this job "has since run against many real pushes"
# without checking -- wrong, and found the hard way. The job had actually
# been failing outright ("Unable to resolve action
# aquasecurity/trivy-action@0.28.0") because that tag was pulled/
# quarantined after a real supply-chain compromise upstream (every
# trivy-action release tag except v0.35.0 was poisoned with a
# credential-stealing payload on 2026-03-19, CVE-2026-33634). Fixed here
# by pinning the Trivy step to its exact commit SHA instead of a tag (see
# that step's own comment for the full incident writeup) and by actually
# checking the Actions tab this time instead of assuming. `fast-tests`
# and `redis-tests` were never affected -- this was isolated to the one
# step that referenced the compromised action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # requirements-fpe.txt (ff3) and requirements-kafka.txt
          # (kafka-python) added here 2026-08-11 (Bug 21, see
          # BUGS_AND_FIXES.md): tests/test_fpe_provider.py and
          # tests/test_queue_consumer.py's Kafka tests need these, and
          # neither needs a LIVE external service (ff3 is pure crypto;
          # the Kafka tests mock kafka.KafkaConsumer entirely) -- unlike
          # requirements-redis.txt/requirements-vault.txt, which need a
          # real running service and stay confined to their own jobs
          # (redis-tests below) or go unrun in CI entirely (Vault).
          # Before this fix, this job was silently getting ZERO coverage
          # of either module: pytest.importorskip("ff3") makes a missing
          # ff3 skip cleanly rather than aborting collection (the actual
          # bug being fixed here), but a clean skip is still a skip --
          # installing the real dependency is what makes these 13 tests
          # (9 fpe + 4 kafka) actually run in CI instead of always
          # silently no-op'ing.
          pip install -r requirements-fpe.txt
          pip install -r requirements-kafka.txt
          pip install pytest
      - name: Run fast validation suite
        run: pytest tests/ -v -m "not needs_redis"

  redis-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-redis.txt
          pip install pytest
      - name: Run Redis-backed validation suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_redis_validation.py -v

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build redact-service image
        run: docker build -t redact-service:ci .
      - name: Scan image with Trivy
        # Pinned by full commit SHA, not a tag -- found 2026-08-11 (Bug 20,
        # BUGS_AND_FIXES.md) that CI had gone red on "Unable to resolve
        # action aquasecurity/trivy-action@0.28.0, unable to find version
        # 0.28.0." Root cause is a real supply-chain compromise, not a
        # routine deprecation: on 2026-03-19, attackers force-pushed a
        # credential-stealing payload into every trivy-action release tag
        # except v0.35.0 (CVE-2026-33634 / GHSA-69fq-xp46-6x23) -- 0.28.0
        # was one of the poisoned tags, later pulled/quarantined, which is
        # why it stopped resolving rather than silently running malicious
        # code. v0.35.0 is the one tag GitHub's immutable-releases
        # protection (enabled 2026-03-04, just before that tag shipped)
        # kept safe. Pinning by its exact commit SHA -- not the tag name --
        # means this step can never silently start running a different,
        # possibly-compromised commit if a tag is ever repointed again.
        # Do not "helpfully" simplify this back to @v0.35.0 or any other
        # tag without re-checking the trivy-action security advisories
        # first.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: redact-service:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
        # Report-only for now (exit-code 0, see the reasoning in this
        # file's own header comment) -- findings show up in the job log,
        # this does not yet block a merge.
