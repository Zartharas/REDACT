# Prometheus scrape config for REDACT's monitoring profile
# (docker-compose.yml, profiles: ["monitoring"]).
#
# Two scrape targets:
#   1. pushgateway -- receives drift.py's per-field critical-hit-rate
#      metrics, pushed once per Airflow DAG run
#      (src/airflow_tasks.py:push_drift_metrics_to_prometheus). Pushgateway
#      is scraped with honor_labels: true so the job/instance labels the
#      pusher set are preserved rather than overwritten by Prometheus's
#      own scrape-target labels -- the standard, documented Pushgateway
#      scrape pattern (without honor_labels, every pushed metric would
#      just show job="pushgateway", losing the actual
#      job="redact_drift_check" label the push set).
#   2. redact-service -- the live /metrics endpoint already wired into
#      src/service.py (redact_anonymize_request_seconds,
#      redact_detections_total, redact_token_store_size,
#      redact_store_save_seconds, redact_store_save_total).
#
# DISCLOSED LIMITATION, same one src/service.py's own module comment
# already states: prometheus_client's default registry is per-process,
# and this project runs redact-service under gunicorn with multiple
# workers, and potentially multiple `--scale redact-service=N` replicas
# behind redact-lb. A single static scrape target here
# (redact-service:8080) only ever sees whichever worker/replica happens
# to answer that particular scrape -- not a cluster-wide aggregate. Fixing
# this for real needs either prometheus_client's PROMETHEUS_MULTIPROC_DIR
# multiprocess mode (aggregates across workers on disk) or per-replica
# DNS-based service discovery (Prometheus dns_sd_configs against
# redact-service's Compose-internal DNS, which returns one A record per
# replica) -- neither is wired up here, disclosed rather than silently
# scraping one instance and calling it complete.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "redact-service"
    metrics_path: /metrics
    # /metrics is behind the same X-Redact-Api-Key check as /anonymize
    # (see service.py's own comment on that route) -- a bare scrape_config
    # with no header will get a 401, not metrics. Prometheus's HTTP client
    # config supports arbitrary custom headers via `headers:` (added
    # 2.47.0); the syntax below is written to that documented shape but
    # has NOT been confirmed against a live Prometheus instance in this
    # sandbox (no Docker daemon here -- same standing disclosure as
    # everything else in this file). Replace REPLACE_WITH_REDACT_API_KEY
    # with the real value of this deployment's REDACT_API_KEY env var
    # before bringing this profile up, and verify the header actually
    # reaches the service (check redact-service's own access logs for a
    # 200 instead of a 401 on the first scrape) rather than trusting this
    # comment.
    headers:
      X-Redact-Api-Key:
        values: ["REPLACE_WITH_REDACT_API_KEY"]
    static_configs:
      - targets: ["redact-service:8080"]
