# REDACT stack: OpenSearch (storage), redact-service (tested detection/
# anonymization/audit logic behind an HTTP API), and Logstash (ingestion,
# calling redact-service, writing to OpenSearch). Airflow is deliberately
# NOT included here -- it runs as a separate weekly batch job against this
# stack's output, not as a live pipeline component, and bundling a full
# Airflow deployment (webserver + scheduler + metadata DB) into this
# compose file would conflate two different operational concerns. See
# requirements-airflow.txt and dags/redact_weekly_validation.py for that
# piece, run separately.
#
# VERIFICATION STATUS, stated plainly: this file was originally written
# without a Docker runtime available, reflecting only OpenSearch's and
# Logstash's documented configuration (verified via web search against
# docs.opensearch.org rather than asserted from memory), not a verified
# build. That has since changed -- this stack has been built and run
# end-to-end (`docker compose up --build`) repeatedly, against all 10,000
# synthetic lines at once, with a single-node OpenSearch instance. That
# testing found and fixed real bugs that documentation review alone would
# not have caught, including an OpenSearch-not-ready-at-startup race that
# caused duplicate writes (see the healthcheck/depends_on block below) and
# several document-ID and audit-routing bugs in redact-pipeline.conf. Full
# writeups are in BUGS_AND_FIXES.md at the repo root. redact-service was
# always the lowest-risk piece here -- it's a standard Python/Flask
# container with no version-sensitive plugin behavior, and its underlying
# code had already been tested extensively outside Docker (see README)
# before Docker was involved at all. This has since been load-tested
# beyond the original demo scale too: validation/load_test/ ran this same
# stack, unmodified, against 100,000 lines (10x the original 10,000-line
# corpus) -- security-logs-anonymized-* = 100,000 exact,
# security-logs-quarantine-* = 0 exact, redact-audit-trail-* = 89,159
# exact, ~250 lines/sec true end-to-end throughput, which itself found and
# fixed two more real bugs (see Bugs 12 and 13 in BUGS_AND_FIXES.md and
# ROADMAP.md item 9). What's still unverified: everything above ran on one
# Docker Desktop machine, single-node/single-shard OpenSearch -- real
# vertical-scale testing (10,000 to 100,000 lines), but nothing here
# establishes behavior on a multi-node OpenSearch cluster, multiple
# redact-service replicas, or actual production ingestion volume.
# opensearch-dashboards remains intentionally omitted:
# OpenSearch's own documentation states that a security-disabled
# Dashboards image is not a published image but something you build
# locally after modifying its config, which is a separate setup step
# outside the scope of this file, not something to gloss over as if it
# were a one-line service addition.

services:
  # OpenSearch 3-node cluster, added 2026-08-11 (ROADMAP.md's own
  # disclosed gap: "nothing here establishes behavior on a multi-node
  # OpenSearch cluster" -- see redact-service's comment block above for
  # that exact language, now out of date as of this change). Replaces
  # the single-node `opensearch` service. 3 nodes, not the 2 shown in
  # OpenSearch's own official example
  # (raw.githubusercontent.com/opensearch-project/documentation-website/
  # main/assets/examples/docker-compose.yml, fetched 2026-08-11): a
  # 2-node cluster cannot demonstrate a real cluster-manager election
  # under a node failure, since 2 participants can't break a 1-1 tie
  # without a third voting member. 3 is the minimum that actually
  # exercises quorum/election behavior, which is the entire point of
  # closing this gap rather than just running more copies of the same
  # single-node config.
  #
  # Cluster formation uses the current OpenSearch setting names --
  # cluster.name, node.name, discovery.seed_hosts,
  # cluster.initial_cluster_manager_nodes -- verified against OpenSearch's
  # own docs rather than assumed from Elasticsearch familiarity, since
  # legacy ES's discovery.zen.minimum_master_nodes/initial_master_nodes
  # naming does NOT carry over unchanged. discovery.type=single-node
  # (the old service's setting) is gone entirely -- it's specifically
  # incompatible with multi-node formation.
  #
  # DISABLE_SECURITY_PLUGIN stays =true on every node, consistent with
  # this project's existing single-node convention (see that flag's own
  # comment below for the standing demo-scope caveat). OpenSearch's
  # official multi-node example instead enables the security plugin with
  # self-signed certs and a default admin password -- more
  # production-representative, but it would make this one service
  # inconsistent with every other node/config in this file and
  # reintroduce a self-signed-cert trust problem for Logstash's and
  # queue-consumer's plain-HTTP clients that this project has
  # deliberately avoided everywhere else. Tracked as a real, disclosed
  # simplification, not an oversight.
  #
  # Per-node JVM heap dropped from the old single-node service's
  # -Xms1g/-Xmx1g to 512m each: three nodes now share the host's memory
  # instead of one, and this project already paid for the OOM lesson
  # once (GUNICORN_WORKERS' comment below, Bug 18) -- tune to your own
  # host; see OpenSearch's Docker tuning guidance for production sizing.
  #
  # NOT YET VERIFIED against a live 3-node run in this sandbox (no
  # Docker daemon here) -- needs the user's machine, same disclosure as
  # every other Docker Compose claim in this project until it's actually
  # been run.
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: redact-opensearch-node1
    environment:
      - cluster.name=redact-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true  # demo/test only -- see chapter Section 9 on why
                                        # this must not be used for real PII-bearing data
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"  # tune to your host; see OpenSearch's own
                                                     # Docker tuning guidance for production sizing
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:  # only node1 is reachable from the host -- node2/node3 are
             # cluster-internal only, reachable over redact-net, matching
             # how every other internal-only service in this file (redis,
             # redact-service) is already scoped
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    networks:
      - redact-net
    healthcheck:  # checks more than "is node1 up" -- number_of_nodes
                   # catches the specific failure mode this item exists to
                   # guard against: node1 comes up fine standalone but
                   # never actually forms a cluster with node2/node3 (bad
                   # seed_hosts, a network issue between containers), which
                   # a plain "node1 is responding" check would miss
                   # entirely and let the rest of the stack start against a
                   # cluster that isn't really a cluster. Gating
                   # logstash/queue-consumer's startup on this (see their
                   # depends_on blocks below) carries forward the same
                   # retry-storm fix the single-node service's healthcheck
                   # existed for, just against a stronger condition.
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health | grep -q '\"number_of_nodes\":3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  opensearch-node2:
    image: opensearchproject/opensearch:latest
    container_name: redact-opensearch-node2
    environment:
      - cluster.name=redact-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - redact-net

  opensearch-node3:
    image: opensearchproject/opensearch:latest
    container_name: redact-opensearch-node3
    environment:
      - cluster.name=redact-cluster
      - node.name=opensearch-node3
      - discovery.seed_hosts=opensearch-node1,opensearch-node2,opensearch-node3
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2,opensearch-node3
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data3:/usr/share/opensearch/data
    networks:
      - redact-net

  redact-service:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name and a fixed host port removed, 2026-08-10 (ROADMAP
    # item 12): Compose refuses to scale a service that declares a fixed
    # container_name ("Cannot scale service ... container name conflict"),
    # and a fixed host-side port mapping ("8080:8080") would collide the
    # moment a second replica tried to bind the same host port. Neither
    # is needed for the pipeline itself -- logstash and the redact-lb
    # proxy below both reach this service over redact-net using Compose's
    # internal DNS (the service name "redact-service" resolves to every
    # healthy replica's container IP), never via the host. Ad hoc manual
    # testing (curl'ing /anonymize directly from the host, as this
    # project's own BUGS_AND_FIXES.md live-debugging sessions did
    # throughout) now needs `docker compose exec redact-service curl
    # localhost:8080/health` (or similar, naming one specific replica)
    # instead of `curl localhost:8080` from the host directly -- a real,
    # disclosed tradeoff of enabling scaling, not an oversight.
    environment:
      - REDACT_PSEUDO_KEY=${REDACT_PSEUDO_KEY:?set a real key in .env, do not use a default}
      - REDACT_AUDIT_KEY=${REDACT_AUDIT_KEY:?set a real key in .env, do not use a default}
      - REDACT_SERVICE_API_KEY=${REDACT_SERVICE_API_KEY:?set a real key in .env, do not use a default}
      # Found while adding the API-key check above: REDACT_FINGERPRINT_KEY
      # and REDACT_TOKEN_KEY were never wired here at all, so every prior
      # "real" Docker Compose run of this stack (including the verified
      # 10,000/100,000/1,000,000-line load tests) actually ran with both
      # still on their demo defaults (src/service.py's own
      # "demo-*-do-not-use-in-prod" fallbacks) -- harmless for what those
      # tests measured (throughput and reconciliation, not key secrecy),
      # but a real gap for anyone treating this compose file as
      # production-representative for those two keys specifically. Fixed
      # here, same required-in-.env pattern as the other keys.
      - REDACT_FINGERPRINT_KEY=${REDACT_FINGERPRINT_KEY:?set a real key in .env, do not use a default}
      - REDACT_TOKEN_KEY=${REDACT_TOKEN_KEY:?set a real key in .env, do not use a default}
      - REDACT_TOKEN_STORE_PATH=/app/output/token_store.json
      # GUNICORN_WORKERS, added 2026-08-10 after a live --scale
      # redact-service=3 run OOM-killed OpenSearch (exit 137): the
      # Dockerfile's CMD used a bare `$(nproc)` workers-per-container, so
      # scaling to N replicas silently multiplied total worker count (and
      # therefore total spaCy/Presidio model-memory, since each gunicorn
      # worker warms its own copy) by N x nproc, not just N x one worker's
      # worth. Default here (2) is a deliberately conservative per-replica
      # count chosen so 3 replicas = 6 total workers regardless of host
      # core count, not `3 x nproc`. Override per-run with
      # `GUNICORN_WORKERS=N docker compose up ...` if your host has memory
      # to spare and you want to test higher per-replica concurrency --
      # this default was chosen to survive the OOM this project actually
      # hit, not benchmarked as an optimal throughput number.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
    volumes:
      - redact-output:/app/output
    # No host port mapping (see comment above) -- reachable only over
    # redact-net now, from logstash, redact-lb, and queue-consumer.
    networks:
      - redact-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Reverse proxy in front of the (now scalable) redact-service pool,
  # 2026-08-10, ROADMAP item 12's "real reverse proxy/load balancer in
  # front" option. Why this instead of relying on Compose's own embedded
  # DNS round-robin directly: Docker's embedded DNS (127.0.0.11) DOES
  # return every healthy replica's IP for the service name
  # "redact-service" when scaled, but whether a given HTTP client
  # actually round-robins across those IPs depends on whether it
  # re-resolves DNS per request or per connection -- a client that opens
  # one persistent/pooled connection and reuses it (keepalive) will keep
  # talking to whichever single replica it first resolved, silently
  # defeating the load-balancing this item exists to test. nginx's
  # `resolver 127.0.0.11 valid=5s` + a variable in `proxy_pass` is the
  # standard, documented technique for forcing periodic re-resolution
  # inside a container on Docker's own network, giving actual
  # request-level distribution across replicas rather than a
  # connection-level accident. See logstash/nginx-lb.conf for the config
  # itself. NOT YET VERIFIED against a live multi-replica run in this
  # sandbox (no Docker daemon here) -- needs the user's machine, same as
  # every other Docker Compose claim in this project.
  redact-lb:
    image: nginx:1.27-alpine
    depends_on:
      - redact-service
    volumes:
      - ./logstash/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - redact-net

  # Redis, 2026-08-10 (ROADMAP item 12): backs the queued ingestion path
  # (redact:raw-events list, see logstash/redact-pipeline-queued.conf and
  # src/queue_consumer.py). NOT currently wired up as redact-service's
  # own TokenStore backend -- RedisStorageProvider (src/anonymize.py) is
  # fully implemented and verified against a live Redis instance for
  # both single- and multi-process safety (Bug 14/ROADMAP item 6), but
  # src/service.py has no env-var-driven way to select it yet; it always
  # uses FileStorageProvider today (see Dockerfile's own comment on this
  # same gap, found while wiring up this queue). Not started by
  # default (see the "queued" profile below) since the synchronous
  # pipeline this stack has always used doesn't need it.
  redis:
    image: redis:7-alpine
    networks:
      - redact-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue-decoupled ingestion path, 2026-08-10 (ROADMAP item 12) -- an
  # ALTERNATIVE to the synchronous logstash service below, not a
  # replacement for it. Both `logstash` (default, always starts) and
  # this profile's services can point at the same raw log files and the
  # same redact-service pool; they are not meant to run against the same
  # input files at the same time (that would double-process every line).
  # Activate with `docker compose --profile queued up` instead of the
  # default `docker compose up`.
  #
  # WHY A QUEUE, AND WHY THIS SHAPE SPECIFICALLY: the synchronous
  # logstash service's http filter blocks each of its pipeline.workers
  # threads on a full round trip to redact-service per event -- this
  # project's own load testing (100,000 and 1,000,000-line runs,
  # BUGS_AND_FIXES.md) confirmed redact-service's per-request cost
  # (CPU-bound NER) is the actual bottleneck, not Logstash itself, so a
  # burst of input just backs up through Logstash's own pipeline with no
  # buffering. Publishing raw events to a queue instead lets ingestion
  # (reading the log files) run at its own pace, decoupled from
  # anonymization throughput, and a burst queues rather than stalls.
  #
  # WHY A REDIS LIST (RPUSH/BLPOP), NOT REDIS STREAMS, DESPITE THE
  # ROADMAP TEXT NAMING STREAMS FIRST: verified via Logstash's own plugin
  # documentation (elastic.co/guide, 2026-08-10) that the OFFICIAL
  # logstash-output-redis plugin supports only `data_type => list`
  # (RPUSH) or `channel` (PUBLISH) -- it does NOT support XADD/Streams.
  # A separate, unofficial plugin (logstash-output-redis-streams, from
  # redis-field-engineering, not the logstash-plugins org, low visible
  # adoption at time of writing) does exist and claims XADD support
  # installable via `bin/logstash-plugin install`, but it hasn't been
  # verified live in this environment (no Docker daemon in this
  # sandbox), and given this exact project's own hard-earned lesson this
  # session (a one-character Logstash config mistake silently crashed
  # the whole pipeline for hours before being caught -- see Bug 16,
  # BUGS_AND_FIXES.md) it would be dishonest to build the "closed for
  # good" queue path on an unverified third-party plugin. A plain Redis
  # list, written via the OFFICIAL plugin, is the lower-risk choice that
  # still achieves the actual architectural goal (decoupling ingestion
  # rate from anonymization throughput). DISCLOSED, REAL TRADEOFF versus
  # true Streams: BLPOP removes an item from the list the instant a
  # consumer pops it -- if that consumer then crashes before finishing
  # (calling redact-service, writing to OpenSearch), that one event is
  # lost, not redelivered. Redis Streams' consumer groups
  # (XREADGROUP/XACK/XPENDING/XCLAIM) exist specifically to survive that
  # case and are the documented next step if logstash-output-redis-streams
  # gets verified working -- src/queue_consumer.py's own docstring has
  # the concrete migration path. Multiple redact-lb/redact-service
  # replicas are NOT protected from this either way; it's specific to
  # the queue's delivery guarantee, not the detection/anonymization path.
  logstash-queued:
    build:
      context: ./logstash
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDACT_QUEUE_KEY=${REDACT_QUEUE_KEY:-redact:raw-events}
    volumes:
      - ./data/raw:/var/log/security:ro
      - ./logstash/redact-pipeline-queued.conf:/usr/share/logstash/pipeline/redact-pipeline.conf:ro
    networks:
      - redact-net
    profiles: ["queued"]

  queue-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "src/queue_consumer.py"]
    depends_on:
      redis:
        condition: service_healthy
      redact-lb:
        condition: service_started
      opensearch-node1:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDACT_QUEUE_KEY=${REDACT_QUEUE_KEY:-redact:raw-events}
      - REDACT_SERVICE_URL=http://redact-lb:8080/anonymize
      - REDACT_SERVICE_API_KEY=${REDACT_SERVICE_API_KEY:?set a real key in .env, do not use a default}
      # OPENSEARCH_HOSTS (plural), not the old single-value OPENSEARCH_HOST
      # -- see src/queue_consumer.py's own comment on this env var for why
      # it lists all three nodes (ordered failover, not load distribution)
      # now that opensearch is a real 3-node cluster. Depends_on above
      # gates on node1 specifically because that's the node whose
      # healthcheck actually verifies 3-node cluster membership -- see
      # opensearch-node1's healthcheck comment above.
      - OPENSEARCH_HOSTS=http://opensearch-node1:9200,http://opensearch-node2:9200,http://opensearch-node3:9200
    networks:
      - redact-net
    profiles: ["queued"]
    # Scale with: docker compose --profile queued up --scale queue-consumer=N
    # BLPOP against the same Redis key is atomic per Redis's own semantics
    # (a given list element is delivered to exactly one popping client),
    # so N consumer processes correctly load-balance the queue with zero
    # extra coordination -- no consumer-group setup needed for THIS
    # guarantee specifically, only for the crash-redelivery guarantee
    # disclosed above, which BLPOP genuinely does not provide.

  logstash:
    build:
      context: ./logstash
      dockerfile: Dockerfile
    container_name: redact-logstash
    depends_on:
      opensearch-node1:
        condition: service_healthy
      redact-service:
        condition: service_healthy
      redact-lb:
        condition: service_started
    environment:
      # Changed 2026-08-10 (ROADMAP item 12) from a direct
      # http://redact-service:8080 URL to the redact-lb nginx proxy in
      # front of the (now scalable) redact-service pool -- see redact-lb's
      # own comment above for why a real proxy was added instead of
      # relying on Compose's embedded DNS round-robin directly. Running
      # with a single redact-service replica (the default,
      # `docker compose up` with no --scale flag) behaves identically to
      # before this change -- redact-lb just adds one extra network hop
      # to a single upstream in that case. The benefit only shows up when
      # scaled: `docker compose up --build --scale redact-service=3`.
      - REDACT_SERVICE_URL=http://redact-lb:8080/anonymize
      - REDACT_SERVICE_API_KEY=${REDACT_SERVICE_API_KEY:?set a real key in .env, do not use a default}
      # OPENSEARCH_HOST removed 2026-08-11, opensearch became a real
      # 3-node cluster -- see logstash/redact-pipeline.conf's opensearch
      # output blocks, which now list all three nodes directly (hosts =>
      # [...] with three entries) instead of interpolating a single env
      # var, since the opensearch-output plugin distributes/fails over
      # across a hosts list itself. depends_on above gates on node1
      # specifically because that's the node whose healthcheck verifies
      # actual 3-node cluster membership, not just that one node is up.
    volumes:
      - ./data/raw:/var/log/security:ro  # run `python src/export_raw_logs.py` first to
                                           # populate this from data/synthetic_logs.jsonl --
                                           # the generator's JSONL output isn't itself in the
                                           # raw per-source format redact-pipeline.conf reads
    networks:
      - redact-net

volumes:
  opensearch-data1:
  opensearch-data2:
  opensearch-data3:
  redact-output:

networks:
  redact-net:
    driver: bridge
