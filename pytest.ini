[pytest]
markers =
    needs_docker: requires a running Docker Compose stack (OpenSearch/Logstash/redact-service)
    needs_redis: requires a reachable Redis instance
    needs_spacy: requires the en_core_web_lg spaCy model to be installed
    needs_external_data: requires data downloaded from an external source (SSA/Census/Loghub) not committed to this repo
testpaths = tests
python_files = test_*.py
